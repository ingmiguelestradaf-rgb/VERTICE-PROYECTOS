name: Proyecto del día (respaldo)

# La tarea programada de Claude genera el proyecto cada mañana (modo híbrido).
# Este flujo es el respaldo: si a las 9:20 a. m. de Tijuana aún no existe el
# proyecto del día, lo genera con el motor automático.
on:
  schedule:
    - cron: "20 16 * * *"
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha AAAA-MM-DD (vacío = hoy)"
        required: false

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Generar
        run: |
          if [ -n "${{ github.event.inputs.fecha }}" ]; then
            python generar.py --fecha "${{ github.event.inputs.fecha }}"
          else
            python generar.py --si-no-existe
          fi
      - name: Publicar
        run: |
          git config user.name "vertice-bot"
          git config user.email "vertice-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || (git commit -m "Proyecto del día $(TZ=America/Tijuana date +%F) (motor automático)" && git push)
