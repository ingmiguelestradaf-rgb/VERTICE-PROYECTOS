name: Proyecto del día (respaldo)

# La tarea programada de Claude genera el proyecto cada mañana (arquitecto + ingenieros).
# Este flujo es el respaldo: si a las 9:20 a. m. de Tijuana aún no existe el proyecto del día,
# lo genera con el motor automático, publica el anteproyecto y sube ambas carpetas a Drive.
on:
  schedule:
    - cron: "20 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Motor de cálculo VERTICE-CALCULO
        env:
          TOKEN: ${{ secrets.VERTICE_CALCULO_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            git clone -q --depth 1 https://x-access-token:${TOKEN}@github.com/ingmiguelestradaf-rgb/VERTICE-CALCULO _calculo
          else
            git clone -q --depth 1 https://github.com/ingmiguelestradaf-rgb/VERTICE-CALCULO _calculo || true
          fi
      - name: Generar
        id: gen
        run: |
          hoy=$(TZ=America/Tijuana date +%F)
          if ls docs/proyectos | grep -q "^$hoy"; then echo "nuevo=no" >> $GITHUB_OUTPUT; exit 0; fi
          python generar.py --fecha "$hoy" --estricto
          echo "nuevo=si" >> $GITHUB_OUTPUT
          echo "clave=$(ls docs/proyectos | grep "^$hoy" | head -1)" >> $GITHUB_OUTPUT
      - name: Publicar anteproyecto
        if: steps.gen.outputs.nuevo == 'si'
        run: |
          git config user.name "vertice-bot"
          git config user.email "vertice-bot@users.noreply.github.com"
          git add docs
          git commit -m "Proyecto del día $(TZ=America/Tijuana date +%F) (motor automático)" && git push
      - name: Subir a Drive
        if: steps.gen.outputs.nuevo == 'si'
        env:
          VERTICE_DRIVE_URL: ${{ secrets.VERTICE_DRIVE_URL }}
          VERTICE_DRIVE_TOKEN: ${{ secrets.VERTICE_DRIVE_TOKEN }}
        run: python drive/subir.py "_privado/${{ steps.gen.outputs.clave }}"
