name: Compilar APK Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compilar
        run: gradle -p android assembleRelease --no-daemon
      - name: Publicar APK en la galería
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk docs/vertice.apk
          git config user.name "vertice-bot"
          git config user.email "vertice-bot@users.noreply.github.com"
          git pull --rebase origin main
          git add docs/vertice.apk
          git diff --cached --quiet || (git commit -m "APK Android actualizado" && git push)
      - uses: actions/upload-artifact@v4
        with:
          name: vertice-apk
          path: android/app/build/outputs/apk/release/app-release.apk
